# Server Port & Reverse Proxy Config
server.port=8081
server.forward-headers-strategy=framework
server.tomcat.threads.max=1000

# Database Configuration (PostgreSQL Database)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.defaultAutoCommit=false

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console Configuration (Disabled for PostgreSQL)
spring.h2.console.enabled=false

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Strava Credentials (set via environment variables for security)
# DO NOT hardcode credentials here
# Set environment variables: STRAVA_CLIENT_ID and STRAVA_CLIENT_SECRET
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}

# Administrator Strava ID (Set via environment variable for deployment)
admin.strava-id=${ADMIN_STRAVA_ID:}

# Security Configuration
security.require-ssl=${REQUIRE_SSL:false}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
server.servlet.session.timeout=30m

# Spring AI (Groq via OpenAI compatibility)
spring.ai.openai.api-key=${GROQ_API_KEY:missing_key}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile