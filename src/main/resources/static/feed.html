<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Feed - GFG Tracker</title>
    <link rel="stylesheet" href="css/style.css?v=1.0.10">
    <link rel="stylesheet" href="css/feed.css?v=1.0.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/navbar.js"></script>
    <script src="/js/csrf.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Top Navigation -->
    <header class="top-nav"></header>

    <div class="app-container" style="max-width: 100%; padding-top: 20px;">
        <main class="feed-container">
            <!-- Create Post Card -->
            <div class="create-post-card">
                <textarea id="post-caption-input" class="create-post-textarea" placeholder="Share your latest workout or thoughts..."></textarea>
                <div id="image-upload-preview-container" style="display:none; margin-bottom: 12px; position: relative;">
                    <img id="image-upload-preview" src="" alt="Image Preview" style="width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; background: #f8fafc;">
                    <button type="button" id="remove-image-btn" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px;">&times;</button>
                </div>

                <div id="selected-activity-preview" style="display:none; margin-bottom: 12px;" class="post-activity-card">
                    <!-- Selected activity preview will be injected here -->
                </div>

                <div class="create-post-actions" style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
                    <div style="display: flex; gap: 10px;">
                        <input type="file" id="image-upload-input" accept="image/jpeg, image/png, image/webp" style="display:none;" />
                        <button id="add-image-btn" class="activity-picker-btn" style="display: flex; align-items: center; gap: 6px;">
                            <i data-lucide="camera" style="width: 18px; height: 18px;"></i> Photo
                        </button>
                        <button id="open-activity-picker-btn" class="activity-picker-btn">
                            <span style="font-size: 16px;">+</span> Attach Activity
                        </button>
                    </div>
                    <button id="submit-post-btn" class="post-btn">Post</button>
                </div>
            </div>

            <!-- Feed Posts Container -->
            <div id="feed-posts-container">
                <div class="loading-spinner">Loading feed...</div>
            </div>
        
    <!-- Floating Action Button for Mobile -->
    <button class="fab-create-post" id="fab-create-post" onclick="window.scrollTo({top:0, behavior:'smooth'}); document.getElementById('post-caption-input').focus();">
        <i data-lucide="plus"></i>
    </button>

        </main>
    </div>

    <!-- Activity Picker Modal -->
    <div id="activity-picker-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Select an Activity to Share</h3>
                <button id="close-modal-btn" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="activity-list-container">
                    <div class="loading-spinner">Loading your recent activities...</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Full Screen Image Viewer Modal -->
    <div id="image-viewer-modal" class="modal-overlay" style="z-index: 1000; display: none; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 20px;">
        <span class="modal-close" id="close-image-viewer" style="position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer;">&times;</span>
        <img class="modal-content" id="full-size-image" style="max-width: 100%; max-height: 90vh; border-radius: 8px; object-fit: contain;">
    </div>
    
    <script src="js/app.js?v=1.0.16"></script>
    <script src="js/feed.js?v=1.0.0"></script>
</body>
</html>
