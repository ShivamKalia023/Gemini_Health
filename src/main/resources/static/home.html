<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Fitness Group Tracker - Home</title>
    <link rel="stylesheet" href="css/style.css?v=2.0.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/navbar.js"></script>
    <script src="/js/csrf.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav"></header>

    <div class="app-container" style="justify-content: center; padding-top: 40px; display: flex;">
        <main class="dashboard-main" style="width: 100%; max-width: 1200px;">
            <!-- Champs Section -->
            <section id="champs-section" class="champs-section">
                <div class="champs-header">
                    <h2>🏆 Champs</h2>
                    <p class="champs-subtitle">Celebrating this week's top performers</p>
                </div>
                <div id="champs-cards-container" class="champs-cards-container">
                    <!-- Skeleton loaders -->
                    <div class="champ-card skeleton"></div>
                    <div class="champ-card skeleton"></div>
                    <div class="champ-card skeleton"></div>
                    <div class="champ-card skeleton"></div>
                </div>
            </section>

            <!-- Two Column Layout -->
            <div class="dashboard-columns">
                <!-- Left Column: Challenges Preview -->
                <section class="leaderboard-section challenges-preview" id="challenges-preview-section">
                    <div class="section-header">
                        <div>
                            <h3>Challenges</h3>
                            <span class="section-subtitle">ACTIVE & UPCOMING</span>
                        </div>
                        <a href="challenges.html" class="view-all">VIEW ALL &rarr;</a>
                    </div>
                    <div id="challenges-preview-list" class="challenges-preview-list">
                        <!-- Skeleton loader shown by default -->
                        <div class="challenge-skeleton"></div>
                        <div class="challenge-skeleton"></div>
                        <div class="challenge-skeleton"></div>
                    </div>
                </section>

                <!-- Right Column: Activity Feed -->
                <section class="feed-section" id="feed-section">
                    <div class="section-header">
                        <div>
                            <h3>Activity Feed</h3>
                            <span class="section-subtitle">LIVE UPDATES</span>
                        </div>
                        <a href="feed.html" class="view-all">VIEW ALL &rarr;</a>
                    </div>
                    <div class="feed-filters-bar">
                        <select id="home-feed-type" class="feed-select" title="Activity Type">
                            <option value="all">All Activities</option>
                            <option value="run">Run</option>
                            <option value="walk">Walk</option>
                            <option value="hike">Hike</option>
                            <option value="ride">Ride</option>
                            <option value="swim">Swim</option>
                            <option value="workout">Workout</option>
                            <option value="row">Row</option>
                            <option value="virtual run">Virtual Run</option>
                            <option value="virtual ride">Virtual Ride</option>
                            <option value="other">Other</option>
                        </select>
                        <select id="home-feed-sort" class="feed-select" title="Sort By">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="longest-dist">Longest Distance</option>
                            <option value="shortest-dist">Shortest Distance</option>
                            <option value="longest-dur">Longest Duration</option>
                            <option value="shortest-dur">Shortest Duration</option>
                        </select>
                    </div>
                    <div id="home-active-filters" class="active-filters-display hidden"></div>
                    <div id="global-feed-list" class="global-feed-list">
                        <div class="loading-text">Loading feed...</div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <script src="js/charts.js?v=1.0.1"></script>
    <script src="js/app.js?v=2.0.0"></script>
</body>
</html>
