<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Fitness Group Tracker - Leaderboard</title>
    <link rel="stylesheet" href="css/style.css?v=1.0.10">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/navbar.js"></script>
    <script src="/js/csrf.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-nav"></header>

    <div class="app-container" style="justify-content: center; padding-top: 40px; display: flex;">
        <main class="dashboard-main" style="width: 100%; max-width: 1200px;">
            <!-- Champion Banner -->
            <div class="champion-banner hidden" id="champion-banner" style="margin-bottom: 40px;">
                <div class="champion-content">
                    <div class="champion-avatar-container">
                        <img id="champion-avatar" src="" alt="Champion">
                        <div class="medal-badge">🏆</div>
                    </div>
                    <div class="champion-info">
                        <span class="champion-label" id="champion-label">■ OVERALL CHAMPION</span>
                        <h2 id="champion-name">--</h2>
                        <div class="champion-stats">
                            <div class="stat">
                                <span class="label">DISTANCE</span>
                                <span class="value" id="champion-dist">-- <span class="unit">km</span></span>
                            </div>
                            <div class="stat">
                                <span class="label">ACTIVITIES</span>
                                <span class="value" id="champion-acts">--</span>
                            </div>
                            <div class="stat">
                                <span class="label">STREAK</span>
                                <span class="value">0 <span class="unit">days</span></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="champion-rank">1</div>
            </div>

            <!-- Leaderboard -->
            <section class="leaderboard-section" id="leaderboard-section" style="width: 100%; height: auto;">
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <div>
                        <h3 id="leaderboard-title">Global Leaderboard</h3>
                        <span class="section-subtitle" id="leaderboard-subtitle">TOP PERFORMERS · ALL TIME</span>
                    </div>
                    <div class="category-filter">
                        <select id="category-select" class="modern-select">
                            <option value="RUN">🏃 Running</option>
                            <option value="RIDE">🚴 Cycling</option>
                            <option value="WALK">🚶 Walking</option>
                            <option value="HIKE">🥾 Hiking</option>
                            <option value="SWIM">🏊 Swimming</option>
                        </select>
                    </div>
                </div>
                <div class="leaderboard-table-container">
                    <table class="leaderboard-table">
                        <thead>
                            <tr>
                                <th>RANK</th>
                                <th>ATHLETE</th>
                                <th style="text-align: right;" id="col-distance">DISTANCE</th>
                                <th style="text-align: right;" id="col-activities">ACTIVITIES</th>
                                <th style="text-align: right;" id="col-average">AVERAGE DISTANCE</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-list">
                            <tr><td colspan="4" class="loading-text">Loading leaderboard...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    
    <script src="js/charts.js?v=1.0.1"></script>
    <script src="js/app.js?v=1.0.16"></script>
</body>
</html>
